<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦占 · 字卡</title>
<style>
  :root{
    --bg:#1a1625; --panel:#2a2438; --user:#4a3f6b; --oracle:#2f2942;
    --text:#e8e3f0; --muted:#9a92b0; --accent:#d4af7a; --border:#3d3552;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;height:100dvh;
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);
  }
  header h1{font-size:17px;margin:0;letter-spacing:2px;color:var(--accent)}
  header button{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:6px 12px;border-radius:14px;font-size:13px;
  }
  #messages{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:12px;
  }
  .msg{
    max-width:85%;padding:10px 14px;border-radius:16px;
    line-height:1.6;word-break:break-word;animation:fade .25s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
  .msg.oracle{align-self:flex-start;background:var(--oracle);border:1px solid var(--border);border-bottom-left-radius:4px}
  .card-char{font-size:56px;text-align:center;color:var(--accent);line-height:1.15;margin:2px 0}
  .card-pinyin{text-align:center;color:var(--muted);font-size:14px}
  .card-keyword{text-align:center;font-size:15px;margin:6px 0 10px;letter-spacing:1px}
  .card-reading{font-size:14px;color:#c9c2db;border-top:1px solid var(--border);padding-top:8px}
  .msg.typing{color:var(--muted);font-size:14px}
  form{
    display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--border);
  }
  input{
    flex:1;padding:12px 14px;border-radius:24px;border:1px solid var(--border);
    background:#1f1a2e;color:var(--text);font-size:16px;outline:none;
  }
  input:focus{border-color:var(--accent)}
  button.send{
    padding:0 20px;border-radius:24px;border:none;
    background:var(--accent);color:#1a1625;font-size:16px;font-weight:600;
  }
  button.send:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <h1>梦 占</h1>
  <button id="clear">清空对话</button>
</header>
<main id="messages"></main>
<form id="inputBar">
  <input id="input" placeholder="写下你的问题…" autocomplete="off" enterkeyhint="send">
  <button class="send" type="submit">问</button>
</form>

<script>
/* ===== 1. 字卡池：以后往这里加卡即可 ===== */
const CARDS = [
  { id:"d001", char:"梦", pinyin:"mèng", keyword:"虚幻 · 启示",
    reading:"此字主潜意识与未明之事。所问之事，答案不在外而在内，宜静观其变，勿急下断语。" },
  { id:"d002", char:"水", pinyin:"shuǐ", keyword:"流动 · 顺势",
    reading:"水无常形，遇物而变。所问之事宜柔不宜刚，退一步反得其道，强行则易生阻。" },
  { id:"d003", char:"火", pinyin:"huǒ", keyword:"炽烈 · 行动",
    reading:"火主显扬与急迫。此事已到该动之时，久拖则势衰。但火亦伤物，出手须留余地。" },
  { id:"d004", char:"山", pinyin:"shān", keyword:"静止 · 阻隔",
    reading:"山不动，主阻。所问之事暂难推进，非人力不足，乃时机未到。守静待时为宜。" },
  { id:"d005", char:"风", pinyin:"fēng", keyword:"变动 · 消息",
    reading:"风无形而能入隙。近日当有消息或变动自远方来，留心身边细语，答案藏在其中。" },
  { id:"d006", char:"月", pinyin:"yuè", keyword:"阴柔 · 周期",
    reading:"月有盈亏，事有往复。所问之事正处周转之中，不必强求圆满，半月之后自见分晓。" },
  { id:"d007", char:"门", pinyin:"mén", keyword:"选择 · 出入",
    reading:"门开两向，主抉择。你心中已有答案，只是不敢推门。此卦示：可入，但须自担其果。" },
  { id:"d008", char:"灯", pinyin:"dēng", keyword:"指引 · 独行",
    reading:"灯照一隅，不照全程。所问之事无需看清全部，只需看清脚下这一步，走稳即是吉。" }
];

/* ===== 2. 存储 ===== */
const KEY = "dream_oracle_chat_v1";
let messages = JSON.parse(localStorage.getItem(KEY) || "[]");
let bag = []; // 洗牌袋，存卡片 id

const $messages = document.getElementById("messages");
const $form = document.getElementById("inputBar");
const $input = document.getElementById("input");
const $clear = document.getElementById("clear");

/* ===== 3. 工具 ===== */
function save(){ localStorage.setItem(KEY, JSON.stringify(messages)); }

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 洗牌袋抽卡：一轮内不重复
function drawCard(){
  if (bag.length === 0) bag = shuffle(CARDS.map(c => c.id));
  const id = bag.pop();
  return CARDS.find(c => c.id === id);
}

/* ===== 4. 渲染 ===== */
function renderMessage(m){
  if (m.role === "user"){
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = m.text;
    return div;
  }
  // oracle
  const div = document.createElement("div");
  div.className = "msg oracle";
  const c = m.card;
  div.innerHTML = `
    <div class="card-char">${c.char}</div>
    <div class="card-pinyin">${c.pinyin}</div>
    <div class="card-keyword">${c.keyword}</div>
    <div class="card-reading">${c.reading}</div>
  `;
  return div;
}

function renderAll(){
  $messages.innerHTML = "";
  messages.forEach(m => $messages.appendChild(renderMessage(m)));
  scrollBottom();
}

function scrollBottom(){
  requestAnimationFrame(() => {
    $messages.scrollTop = $messages.scrollHeight;
  });
}

/* ===== 5. 发送流程 ===== */
$form.addEventListener("submit", e => {
  e.preventDefault();
  const text = $input.value.trim();
  if (!text) return;

  $input.value = "";
  $input.disabled = true;
  $form.querySelector(".send").disabled = true;

  // 用户消息
  const userMsg = { role:"user", text, t: Date.now() };
  messages.push(userMsg);
  $messages.appendChild(renderMessage(userMsg));
  save();
  scrollBottom();

  // “对方”思考中
  const typing = document.createElement("div");
  typing.className = "msg oracle typing";
  typing.textContent = "对方正在起卦…";
  $messages.appendChild(typing);
  scrollBottom();

  // 延迟后抽卡回复
  setTimeout(() => {
    typing.remove();
    const card = drawCard();
    const oracleMsg = { role:"oracle", cardId: card.id, t: Date.now() };
    messages.push(oracleMsg);
    $messages.appendChild(renderMessage(oracleMsg));
    save();
    scrollBottom();

    $input.disabled = false;
    $form.querySelector(".send").disabled = false;
    $input.focus();
  }, 800 + Math.random() * 600);
});

/* ===== 6. 清空 ===== */
$clear.addEventListener("click", () => {
  if (!confirm("确定清空全部对话记录？")) return;
  messages = [];
  bag = [];
  localStorage.removeItem(KEY);
  renderAll();
});

/* ===== 7. 启动 ===== */
if (messages.length === 0){
  // 首次进入给一句开场
  const intro = document.createElement("div");
  intro.className = "msg oracle";
  intro.textContent = "静心，写下你想问的事。字卡会替你抽出一签。";
  $messages.appendChild(intro);
} else {
  renderAll();
}
</script>
</body>
</html>
