<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦占 · 字卡</title>
<style>
  :root{
    --bg:#1a1625; --panel:#2a2438; --user:#4a3f6b; --oracle:#2f2942;
    --text:#e8e3f0; --muted:#9a92b0; --accent:#d4af7a; --border:#3d3552;
    --danger:#e05353;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;height:100dvh;
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  }
  
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);
    z-index:10;
  }
  header h1{font-size:17px;margin:0;letter-spacing:2px;color:var(--accent)}
  .header-btns button{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:6px 10px;border-radius:14px;font-size:13px;margin-left:6px;
  }

  #messages{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:12px;
  }
  .msg{
    max-width:85%;padding:10px 14px;border-radius:16px;
    line-height:1.6;word-break:break-word;animation:fade .25s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
  .msg.oracle{align-self:flex-start;background:var(--oracle);border:1px solid var(--border);border-bottom-left-radius:4px;padding:12px}
  
  .card-char{font-size:56px;text-align:center;color:var(--accent);line-height:1.15;margin:2px 0}
  .card-pinyin{text-align:center;color:var(--muted);font-size:14px}
  .card-keyword{text-align:center;font-size:15px;margin:6px 0 10px;letter-spacing:1px}
  .card-reading{font-size:14px;color:#c9c2db;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
  .card-image{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-top:10px;background:#000}
  .msg.typing{color:var(--muted);font-size:14px}

  form{
    display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--border);z-index:10;
  }
  input{
    flex:1;padding:12px 14px;border-radius:24px;border:1px solid var(--border);
    background:#1f1a2e;color:var(--text);font-size:16px;outline:none;
  }
  input:focus{border-color:var(--accent)}
  button.send{
    padding:0 20px;border-radius:24px;border:none;
    background:var(--accent);color:#1a1625;font-size:16px;font-weight:600;
  }
  button.send:disabled{opacity:.5}

  /* 管理面板样式 */
  #adminPanel{
    position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);
    z-index:100;display:none;flex-direction:column;
  }
  #adminPanel.show{display:flex}
  .admin-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);
  }
  .admin-header h2{font-size:16px;margin:0;color:var(--accent)}
  .admin-header button{background:none;border:none;color:var(--text);font-size:16px}
  
  .admin-content{flex:1;overflow-y:auto;padding:16px;}
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .form-group input[type="text"]{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:#1f1a2e;color:#fff;font-size:15px;
  }
  .form-group input[type="file"]{font-size:14px;color:var(--muted);}
  
  .admin-btn{
    width:100%;padding:12px;border-radius:8px;border:none;
    background:var(--accent);color:#1a1625;font-size:16px;font-weight:600;margin-top:10px;
  }
  
  /* 自定义卡片列表 */
  .custom-list-title{font-size:15px;color:var(--text);margin:24px 0 10px 0;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .custom-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px;background:var(--panel);border-radius:8px;margin-bottom:8px;
  }
  .custom-item-info{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .custom-item-char{font-size:18px;color:var(--accent);font-weight:bold;margin-right:8px;}
  .custom-item-text{font-size:13px;color:var(--muted);}
  .btn-delete{
    background:var(--danger);color:#fff;border:none;border-radius:6px;
    padding:6px 10px;font-size:12px;margin-left:10px;
  }

  .data-btn-group{display:flex;gap:10px;margin-top:20px}
  .data-btn-group button, .data-btn-group label{
    flex:1;text-align:center;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--text);font-size:14px;cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>梦 占</h1>
  <div class="header-btns">
    <button id="openAdmin">管理</button>
    <button id="clear">清空对话</button>
  </div>
</header>

<main id="messages"></main>

<form id="inputBar">
  <input id="input" placeholder="请输入…" autocomplete="off" enterkeyhint="send">
  <button class="send" type="submit">问</button>
</form>

<!-- 管理面板 -->
<div id="adminPanel">
  <div class="admin-header">
    <h2>字卡管理</h2>
    <button id="closeAdmin">关闭</button>
  </div>
  
  <div class="admin-content">
    <h3 style="font-size:15px; margin-top:0; color:var(--text);">添加新字卡</h3>
    
    <div class="form-group">
      <label>汉字（必填）</label>
      <input type="text" id="newChar" placeholder="例如：花">
    </div>
    <div class="form-group">
      <label>拼音</label>
      <input type="text" id="newPinyin" placeholder="例如：huā">
    </div>
    <div class="form-group">
      <label>关键词</label>
      <input type="text" id="newKeyword" placeholder="例如：绽放 · 结果">
    </div>
    <div class="form-group">
      <label>解读（必填）</label>
      <input type="text" id="newReading" placeholder="写下解卦的文案...">
    </div>
    <div class="form-group">
      <label>上传配图（可选）</label>
      <input type="file" id="newImage" accept="image/*">
    </div>
    
    <button class="admin-btn" id="saveCardBtn">保存新卡</button>

    <!-- 新增：自定义卡片列表 -->
    <div class="custom-list-title">我添加的字卡（点击可删除）</div>
    <div id="customList"></div>

    <div class="data-btn-group">
      <button id="exportBtn">导出我的卡片</button>
      <label>
        导入卡片 <input type="file" id="importFile" accept=".json" style="display:none;">
      </label>
    </div>
  </div>
</div>

<script>
/* ===== 1. 默认字卡池 ===== */
const DEFAULT_CARDS = [];

/* ===== 2. 数据状态 ===== */
const KEY_CHAT = "dream_oracle_chat_v1";
const KEY_CUSTOM = "dream_oracle_custom_v1";
let messages = JSON.parse(localStorage.getItem(KEY_CHAT) || "[]");
let customCards = JSON.parse(localStorage.getItem(KEY_CUSTOM) || "[]");
let bag = []; 

function getAllCards() { return [...DEFAULT_CARDS, ...customCards]; }

/* ===== 3. DOM 元素 ===== */
const $messages = document.getElementById("messages");
const $form = document.getElementById("inputBar");
const $input = document.getElementById("input");
const $clear = document.getElementById("clear");
const $adminPanel = document.getElementById("adminPanel");
const $customList = document.getElementById("customList");

/* ===== 4. 工具 ===== */
function saveChat(){ localStorage.setItem(KEY_CHAT, JSON.stringify(messages)); }
function saveCustom(){ localStorage.setItem(KEY_CUSTOM, JSON.stringify(customCards)); }

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawCard(){
  const allCards = getAllCards();
  if (bag.length === 0) bag = shuffle(allCards.map(c => c.id));
  const id = bag.pop();
  return allCards.find(c => c.id === id) || allCards[0];
}

/* ===== 5. 渲染聊天 ===== */
function renderMessage(m){
  if (m.role === "user"){
    const div = document.createElement("div");
    div.className = "msg user"; div.textContent = m.text; return div;
  }
  const div = document.createElement("div");
  div.className = "msg oracle";
  const allCards = getAllCards();
  const c = allCards.find(card => card.id === m.cardId) || allCards[0];
  let imgHtml = c.image ? `< img src="${c.image}" class="card-image" alt="卡面">` : "";
  div.innerHTML = `
    <div class="card-char">${c.char}</div>
    <div class="card-pinyin">${c.pinyin || '&nbsp;'}</div>
    <div class="card-keyword">${c.keyword || ''}</div>
    <div class="card-reading">${c.reading}</div>
    ${imgHtml}
  `;
  return div;
}

function renderAll(){
  $messages.innerHTML = "";
  messages.forEach(m => $messages.appendChild(renderMessage(m)));
  scrollBottom();
}
function scrollBottom(){ requestAnimationFrame(() => { $messages.scrollTop = $messages.scrollHeight; }); }

/* ===== 6. 聊天发送流程 ===== */
$form.addEventListener("submit", e => {
  e.preventDefault();
  const text = $input.value.trim(); if (!text) return;
  $input.value = ""; $input.disabled = true; $form.querySelector(".send").disabled = true;

  const userMsg = { role:"user", text, t: Date.now() };
  messages.push(userMsg); $messages.appendChild(renderMessage(userMsg)); saveChat(); scrollBottom();

  const typing = document.createElement("div");
  typing.className = "msg oracle typing"; typing.textContent = "对方正在输入中…";
  $messages.appendChild(typing); scrollBottom();

  setTimeout(() => {
    typing.remove();
    const card = drawCard();
    const oracleMsg = { role:"oracle", cardId: card.id, t: Date.now() };
    messages.push(oracleMsg); $messages.appendChild(renderMessage(oracleMsg)); saveChat(); scrollBottom();
    $input.disabled = false; $form.querySelector(".send").disabled = false; $input.focus();
  }, 800 + Math.random() * 600);
});

/* ===== 7. 管理面板与自定义卡片逻辑 ===== */
// 渲染自定义卡片列表
function renderCustomList() {
  $customList.innerHTML = "";
  if (customCards.length === 0) {
    $customList.innerHTML = `<div style="color:var(--muted); font-size:13px; text-align:center; padding:10px;">暂无自定义卡片</div>`;
    return;
  }
  
  customCards.forEach(card => {
    const div = document.createElement("div");
    div.className = "custom-item";
    div.innerHTML = `
      <div class="custom-item-info">
        <span class="custom-item-char">${card.char}</span>
        <span class="custom-item-text">${card.keyword || card.reading}</span>
      </div>
      <button class="btn-delete" data-id="${card.id}">删除</button>
    `;
    // 绑定删除事件
    div.querySelector(".btn-delete").onclick = () => {
      if (confirm(`确定要删除【${card.char}】这张卡吗？`)) {
        customCards = customCards.filter(c => c.id !== card.id);
        saveCustom();
        renderCustomList();
        bag = []; // 重置洗牌袋
      }
    };
    $customList.appendChild(div);
  });
}

document.getElementById("openAdmin").onclick = () => {
  renderCustomList(); // 每次打开都刷新一下列表
  $adminPanel.classList.add("show");
};
document.getElementById("closeAdmin").onclick = () => $adminPanel.classList.remove("show");

// 保存新卡
document.getElementById("saveCardBtn").onclick = () => {
  const char = document.getElementById("newChar").value.trim();
  const pinyin = document.getElementById("newPinyin").value.trim();
  const keyword = document.getElementById("newKeyword").value.trim();
  const reading = document.getElementById("newReading").value.trim();
  const imageFile = document.getElementById("newImage").files[0];

  if (!char || !reading) return alert("汉字和解读不能为空哦！");

  const processCard = (imageBase64) => {
    const newCard = {
      id: "c_" + Date.now(),
      char, pinyin, keyword, reading, image: imageBase64 || ""
    };
    
    customCards.push(newCard);
    saveCustom();
    
    document.getElementById("newChar").value = "";
    document.getElementById("newPinyin").value = "";
    document.getElementById("newKeyword").value = "";
    document.getElementById("newReading").value = "";
    document.getElementById("newImage").value = "";

    bag = []; 
    renderCustomList(); // 刷新列表
    alert("添加成功！");
  };

  if (imageFile) {
    const reader = new FileReader();
    reader.onload = (e) => processCard(e.target.result);
    reader.readAsDataURL(imageFile);
  } else {
    processCard(null);
  }
};

// 导出数据
document.getElementById("exportBtn").onclick = () => {
  if(customCards.length === 0) return alert("你还没有添加任何自定义卡片哦！");
  const blob = new Blob([JSON.stringify(customCards, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "my_custom_cards.json";
  a.click();
  URL.revokeObjectURL(url);
};

// 导入数据
document.getElementById("importFile").onchange = (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const imported = JSON.parse(event.target.result);
      if (Array.isArray(imported)) {
        imported.forEach(impCard => {
          if(!customCards.find(c => c.id === impCard.id)) customCards.push(impCard);
        });
        saveCustom();
        bag = [];
        renderCustomList(); // 刷新列表
        alert(`成功导入了 ${imported.length} 张卡片！`);
      }
    } catch (err) { alert("导入失败，文件格式不对。"); }
  };
  reader.readAsText(file);
};

$clear.addEventListener("click", () => {
  if (!confirm("确定清空全部对话记录？")) return;
  messages = []; bag = []; localStorage.removeItem(KEY_CHAT); renderAll();
});

if (messages.length === 0){
  const intro = document.createElement("div");
  intro.className = "msg oracle";
  intro.textContent = "请输入文本...";
  $messages.appendChild(intro);
} else { renderAll(); }
</script>
</body>
</html>
