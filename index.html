
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦占 · 对话</title>
<style>
  :root{
    --bg:#12101a; --panel:#1e1b29; --user:#4a3f6b; --oracle:#2a2438;
    --text:#e8e3f0; --muted:#9a92b0; --accent:#d4af7a; --border:#3d3552;
    --danger:#e05353;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;height:100dvh;
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  }
  
  /* ====== 顶部导航（聊天软件风格） ====== */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);
    z-index:10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--border); display: flex; justify-content: center; align-items: center;
    font-size: 24px; overflow: hidden; border: 1px solid var(--accent);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .info-box { display: flex; flex-direction: column; }
  .info-name { font-size: 16px; font-weight: 600; color: var(--text); }
  .info-status { font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 4px; }
  .info-status::before { content: "●"; font-size: 10px; color: #4caf50; } /* 绿点表示在线 */
  
  .header-btns button{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:6px 10px;border-radius:14px;font-size:13px;margin-left:6px;
  }

  /* ====== 聊天区域 ====== */
  #messages{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:16px;
  }
  
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 90%; animation: fade .3s ease;}
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.oracle { align-self: flex-start; }

  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
  
  .msg-bubble {
    padding: 12px 16px; border-radius: 18px; line-height: 1.6; font-size: 15px;
    word-break: break-word; position: relative;
  }
  .msg-row.user .msg-bubble {
    background: var(--user); border-top-right-radius: 4px; color: #fff;
  }
  .msg-row.oracle .msg-bubble {
    background: var(--oracle); border: 1px solid var(--border); border-top-left-radius: 4px;
    min-width: 200px;
  }
  
  /* 卡片专属样式 */
  .card-char{font-size:60px;text-align:center;color:var(--accent);line-height:1.1;margin:4px 0;text-shadow: 0 2px 10px rgba(212,175,122,0.3);}
  .card-pinyin{text-align:center;color:var(--muted);font-size:14px;letter-spacing: 1px;}
  .card-keyword{text-align:center;font-size:15px;margin:8px 0 12px;letter-spacing:1px;color:var(--text);font-weight: 500;}
  .card-reading{font-size:14px;color:#c9c2db;border-top:1px dashed var(--border);padding-top:10px;margin-top:8px;}
  .card-image{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-top:10px;background:#000}
  
  .msg.typing{ color: var(--muted); font-size: 14px; font-style: italic;}

  /* ====== 底部输入 ====== */
  form{
    display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--border);z-index:10;
  }
  input{
    flex:1;padding:12px 16px;border-radius:24px;border:1px solid var(--border);
    background:#12101a;color:var(--text);font-size:16px;outline:none;
  }
  input:focus{border-color:var(--accent)}
  button.send{
    padding:0 20px;border-radius:24px;border:none;
    background:var(--accent);color:#1a1625;font-size:16px;font-weight:600;
  }
  button.send:disabled{opacity:.5}

  /* ====== 管理面板 ====== */
  #adminPanel{
    position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);
    z-index:100;display:none;flex-direction:column;
  }
  #adminPanel.show{display:flex}
  .admin-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);
  }
  .admin-header h2{font-size:16px;margin:0;color:var(--accent)}
  .admin-header button{background:none;border:none;color:var(--text);font-size:16px}
  
  .admin-content{flex:1;overflow-y:auto;padding:16px;}
  .section-title {font-size:15px; color:var(--text); margin:24px 0 10px 0; border-bottom:1px solid var(--border); padding-bottom:6px;}
  .section-title:first-child { margin-top: 0; }
  
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .form-group input[type="text"]{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:#1f1a2e;color:#fff;font-size:15px;
  }
  .form-group input[type="file"]{font-size:14px;color:var(--muted);}
  
  .admin-btn{
    width:100%;padding:12px;border-radius:8px;border:none;
    background:var(--accent);color:#1a1625;font-size:16px;font-weight:600;margin-top:5px;
  }
  
  /* 列表通用样式 */
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px;background:var(--panel);border-radius:8px;margin-bottom:8px;
  }
  .list-item-info{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .btn-delete{
    background:var(--danger);color:#fff;border:none;border-radius:6px;
    padding:6px 10px;font-size:12px;margin-left:10px; flex-shrink: 0;
  }
  
  .data-btn-group{display:flex;gap:10px;margin-top:20px; margin-bottom: 40px;}
  .data-btn-group button, .data-btn-group label{
    flex:1;text-align:center;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--text);font-size:14px;cursor:pointer;
  }
</style>
</head>
<body>

<!-- 顶部聊天对象信息 -->
<header>
  <div class="header-left">
    <div class="avatar" id="oracleAvatar">🔮</div>
    <div class="info-box">
      <div class="info-name">梦占灵体</div>
      <div class="info-status" id="oracleStatus">等待你的呼唤...</div>
    </div>
  </div>
  <div class="header-btns">
    <button id="openAdmin">管理</button>
    <button id="clear">清空</button>
  </div>
</header>

<!-- 聊天区 -->
<main id="messages"></main>

<!-- 底部输入 -->
<form id="inputBar">
  <input id="input" placeholder="写下你想问的事…" autocomplete="off" enterkeyhint="send">
  <button class="send" type="submit">发送</button>
</form>

<!-- 管理面板 -->
<div id="adminPanel">
  <div class="admin-header">
    <h2>系统管理</h2>
    <button id="closeAdmin">关闭</button>
  </div>
  
  <div class="admin-content">
    <!-- 头像设置 -->
    <div class="section-title">聊天对象头像（可选）</div>
    <div class="form-group">
      <input type="file" id="avatarUpload" accept="image/*">
    </div>

    <!-- 添加状态 -->
    <div class="section-title">添加随机状态</div>
    <div class="form-group">
      <label>状态文字（例如：正在凝视深渊）</label>
      <input type="text" id="newStatus" placeholder="输入一句状态语...">
    </div>
    <button class="admin-btn" id="saveStatusBtn">保存状态</button>
    <div id="statusList"></div>

    <!-- 添加卡片 -->
    <div class="section-title">添加新字卡</div>
    <div class="form-group">
      <label>汉字（必填）</label>
      <input type="text" id="newChar" placeholder="例如：花">
    </div>
    <div class="form-group">
      <label>拼音</label>
      <input type="text" id="newPinyin" placeholder="例如：huā">
    </div>
    <div class="form-group">
      <label>关键词</label>
      <input type="text" id="newKeyword" placeholder="例如：绽放 · 结果">
    </div>
    <div class="form-group">
      <label>解读（必填）</label>
      <input type="text" id="newReading" placeholder="写下解卦的文案...">
    </div>
    <div class="form-group">
      <label>上传配图（可选）</label>
      <input type="file" id="newImage" accept="image/*">
    </div>
    <button class="admin-btn" id="saveCardBtn">保存字卡</button>
    <div id="customList"></div>

    <!-- 导入导出 -->
    <div class="data-btn-group">
      <button id="exportBtn">导出所有数据</button>
      <label>导入数据 <input type="file" id="importFile" accept=".json" style="display:none;"></label>
    </div>
  </div>
</div>

<script>
/* ===== 1. 默认数据 ===== */
const DEFAULT_CARDS = [];

const DEFAULT_STATUSES = ["正在冥想", "倾听风的声音", "为你翻阅命运", "沉睡中...", "刚刚苏醒"];
const DEFAULT_AVATAR = "🔮"; // 默认头像使用 Emoji

/* ===== 2. 数据读取 ===== */
const KEY_CHAT = "dream_oracle_chat_v1";
const KEY_CUSTOM = "dream_oracle_custom_v1";
const KEY_STATUS = "dream_oracle_status_v1";
const KEY_AVATAR = "dream_oracle_avatar_v1";

let messages = JSON.parse(localStorage.getItem(KEY_CHAT) || "[]");
let customCards = JSON.parse(localStorage.getItem(KEY_CUSTOM) || "[]");
let customStatuses = JSON.parse(localStorage.getItem(KEY_STATUS) || "[]");
let currentAvatar = localStorage.getItem(KEY_AVATAR) || DEFAULT_AVATAR;
let bag = []; 

function getAllCards() { return [...DEFAULT_CARDS, ...customCards]; }
function getAllStatuses() { return [...DEFAULT_STATUSES, ...customStatuses]; }

/* ===== 3. DOM 元素 ===== */
const $messages = document.getElementById("messages");
const $form = document.getElementById("inputBar");
const $input = document.getElementById("input");
const $clear = document.getElementById("clear");
const $adminPanel = document.getElementById("adminPanel");
const $statusText = document.getElementById("oracleStatus");
const $avatarBox = document.getElementById("oracleAvatar");

/* ===== 4. 工具 ===== */
function saveChat(){ localStorage.setItem(KEY_CHAT, JSON.stringify(messages)); }
function saveCustom(){ localStorage.setItem(KEY_CUSTOM, JSON.stringify(customCards)); }
function saveStatus(){ localStorage.setItem(KEY_STATUS, JSON.stringify(customStatuses)); }

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawCard(){
  const allCards = getAllCards();
  if (bag.length === 0) bag = shuffle(allCards.map(c => c.id));
  const id = bag.pop();
  return allCards.find(c => c.id === id) || allCards[0];
}

// 更新头像显示
function renderAvatar() {
  if (currentAvatar.startsWith("data:image")) {
    $avatarBox.innerHTML = `<img src="${currentAvatar}" alt="avatar">`;
  } else {
    $avatarBox.textContent = currentAvatar;
  }
}

// 随机切换状态
function rollStatus() {
  const list = getAllStatuses();
  $statusText.textContent = list[Math.floor(Math.random() * list.length)];
}

/* ===== 5. 渲染聊天 ===== */
function renderMessage(m){
  const row = document.createElement("div");
  
  if (m.role === "user"){
    row.className = "msg-row user";
    // 用户只有气泡，不需要头像（或者你可以加一个固定头像）
    row.innerHTML = `<div class="msg-bubble">${m.text}</div>`;
    return row;
  }
  
  // 占卜师（对方）的消息
  row.className = "msg-row oracle";
  const allCards = getAllCards();
  const c = allCards.find(card => card.id === m.cardId) || allCards[0];
  let imgHtml = c.image ? `<img src="${c.image}" class="card-image" alt="卡面">` : "";
  
  let avatarContent = currentAvatar.startsWith("data:image") 
    ? `<img src="${currentAvatar}">` 
    : currentAvatar;

  row.innerHTML = `
    <div class="avatar">${avatarContent}</div>
    <div class="msg-bubble">
      <div class="card-char">${c.char}</div>
      <div class="card-pinyin">${c.pinyin || '&nbsp;'}</div>
      <div class="card-keyword">${c.keyword || ''}</div>
      <div class="card-reading">${c.reading}</div>
      ${imgHtml}
    </div>
  `;
  return row;
}

function renderAll(){
  $messages.innerHTML = "";
  messages.forEach(m => $messages.appendChild(renderMessage(m)));
  scrollBottom();
}
function scrollBottom(){ requestAnimationFrame(() => { $messages.scrollTop = $messages.scrollHeight; }); }

/* ===== 6. 聊天发送流程 ===== */
$form.addEventListener("submit", e => {
  e.preventDefault();
  const text = $input.value.trim(); if (!text) return;
  $input.value = ""; $input.disabled = true; $form.querySelector(".send").disabled = true;

  // 发送用户消息
  const userMsg = { role:"user", text, t: Date.now() };
  messages.push(userMsg); $messages.appendChild(renderMessage(userMsg)); saveChat(); scrollBottom();

  // 对方状态切换 & 打字提示
  rollStatus(); // 每次发消息，随机换个状态
  const typingRow = document.createElement("div");
  typingRow.className = "msg-row oracle";
  let avatarContent = currentAvatar.startsWith("data:image") ? `<img src="${currentAvatar}">` : currentAvatar;
  typingRow.innerHTML = `
    <div class="avatar">${avatarContent}</div>
    <div class="msg-bubble msg typing">输入0中...</div>
  `;
  $messages.appendChild(typingRow); scrollBottom();

  // 延迟后出结果
  setTimeout(() => {
    typingRow.remove();
    const card = drawCard();
    const oracleMsg = { role:"oracle", cardId: card.id, t: Date.now() };
    messages.push(oracleMsg); $messages.appendChild(renderMessage(oracleMsg)); saveChat(); scrollBottom();
    $input.disabled = false; $form.querySelector(".send").disabled = false; $input.focus();
  }, 1200 + Math.random() * 500);
});

/* ===== 7. 管理面板逻辑 ===== */
document.getElementById("openAdmin").onclick = () => {
  renderCustomList();
  renderStatusList();
  $adminPanel.classList.add("show");
};
document.getElementById("closeAdmin").onclick = () => $adminPanel.classList.remove("show");

// 上传头像
document.getElementById("avatarUpload").onchange = (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    currentAvatar = event.target.result;
    localStorage.setItem(KEY_AVATAR, currentAvatar);
    renderAvatar();
    renderAll(); // 刷新聊天记录里的头像
    alert("头像更新成功！");
  };
  reader.readAsDataURL(file);
};

// === 状态管理 ===
document.getElementById("saveStatusBtn").onclick = () => {
  const statusText = document.getElementById("newStatus").value.trim();
  if (!statusText) return alert("状态不能为空哦！");
  customStatuses.push(statusText);
  saveStatus();
  document.getElementById("newStatus").value = "";
  renderStatusList();
  alert("状态添加成功！");
};

function renderStatusList() {
  const $list = document.getElementById("statusList");
  $list.innerHTML = "";
  if (customStatuses.length === 0) return;
  
  customStatuses.forEach((status, index) => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <div class="list-item-info" style="color:var(--muted); font-size:14px;">${status}</div>
      <button class="btn-delete" onclick="deleteStatus(${index})">删除</button>
    `;
    $list.appendChild(div);
  });
}

window.deleteStatus = (index) => {
  if (confirm(`确定删除状态【${customStatuses[index]}】吗？`)) {
    customStatuses.splice(index, 1);
    saveStatus();
    renderStatusList();
  }
};

// === 卡片管理 ===
document.getElementById("saveCardBtn").onclick = () => {
  const char = document.getElementById("newChar").value.trim();
  const pinyin = document.getElementById("newPinyin").value.trim();
  const keyword = document.getElementById("newKeyword").value.trim();
  const reading = document.getElementById("newReading").value.trim();
  const imageFile = document.getElementById("newImage").files[0];

  if (!char || !reading) return alert("汉字和解读不能为空哦！");

  const processCard = (imageBase64) => {
    const newCard = { id: "c_" + Date.now(), char, pinyin, keyword, reading, image: imageBase64 || "" };
    customCards.push(newCard);
    saveCustom();
    
    // 清空表单
    document.getElementById("newChar").value = "";
    document.getElementById("newPinyin").value = "";
    document.getElementById("newKeyword").value = "";
    document.getElementById("newReading").value = "";
    document.getElementById("newImage").value = "";

    bag = []; 
    renderCustomList(); 
    alert("字卡添加成功！");
  };

  if (imageFile) {
    const reader = new FileReader();
    reader.onload = (e) => processCard(e.target.result);
    reader.readAsDataURL(imageFile);
  } else {
    processCard(null);
  }
};

function renderCustomList() {
  const $list = document.getElementById("customList");
  $list.innerHTML = "";
  if (customCards.length === 0) return;
  
  customCards.forEach((card) => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <div class="list-item-info">
        <span style="font-size:18px;color:var(--accent);font-weight:bold;margin-right:8px;">${card.char}</span>
        <span style="font-size:13px;color:var(--muted);">${card.keyword || card.reading}</span>
      </div>
      <button class="btn-delete" onclick="deleteCard('${card.id}')">删除</button>
    `;
    $list.appendChild(div);
  });
}

window.deleteCard = (id) => {
  if (confirm("确定要删除这张字卡吗？")) {
    customCards = customCards.filter(c => c.id !== id);
    saveCustom();
    renderCustomList();
    bag = []; 
  }
};

// === 导入导出（合并了卡片和状态） ===
document.getElementById("exportBtn").onclick = () => {
  const data = { cards: customCards, statuses: customStatuses, avatar: currentAvatar };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "my_oracle_data.json";
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById("importFile").onchange = (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const data = JSON.parse(event.target.result);
      
      if (data.cards) {
        data.cards.forEach(imp => {
          if(!customCards.find(c => c.id === imp.id)) customCards.push(imp);
        });
        saveCustom();
      }
      if (data.statuses) {
        data.statuses.forEach(s => {
          if(!customStatuses.includes(s)) customStatuses.push(s);
        });
        saveStatus();
      }
      if (data.avatar) {
        currentAvatar = data.avatar;
        localStorage.setItem(KEY_AVATAR, currentAvatar);
        renderAvatar();
      }
      
      bag = [];
      renderCustomList(); renderStatusList(); renderAll();
      alert("数据导入成功！");
    } catch (err) { alert("导入失败，文件格式不正确。"); }
  };
  reader.readAsText(file);
};

/* ===== 8. 初始化 ===== */
$clear.addEventListener("click", () => {
  if (!confirm("确定清空全部对话记录？")) return;
  messages = []; bag = []; localStorage.removeItem(KEY_CHAT); renderAll();
});

// 启动
renderAvatar();
if (messages.length === 0){
  rollStatus();
  const introRow = document.createElement("div");
  introRow.className = "msg-row oracle";
  let avatarContent = currentAvatar.startsWith("data:image") ? `<img src="${currentAvatar}">` : currentAvatar;
  introRow.innerHTML = `
    <div class="avatar">${avatarContent}</div>
    <div class="msg-bubble" style="color:var(--muted);">请输入文本</div>
  `;
  $messages.appendChild(introRow);
} else { renderAll(); rollStatus(); }
</script>
</body>
</html>
