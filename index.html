<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梦占 · 对话</title>
<style>
  :root{
    --bg:#12101a; --panel:#1e1b29; --user:#4a3f6b; --oracle:#2a2438;
    --text:#e8e3f0; --muted:#9a92b0; --accent:#d4af7a; --border:#3d3552;
    --danger:#e05353; --font-size: 15px; --bg-image: none;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;height:100dvh;
    color:var(--text); font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
    position: relative; background-color: var(--bg); overflow: hidden;
  }

  #bgLayer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: var(--bg-image); background-size: cover; background-position: center; z-index: -2; }
  #bgMask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(18, 16, 26, 0.85); z-index: -1; }
  
  /* 顶部 */
  header{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:rgba(30,27,41,0.9); border-bottom:1px solid var(--border); z-index:10; backdrop-filter: blur(5px); }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--border); display: flex; justify-content: center; align-items: center; font-size: 24px; overflow: hidden; border: 1px solid var(--accent); flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .info-box { display: flex; flex-direction: column; }
  .info-name { font-size: 16px; font-weight: 600; color: var(--text); }
  .info-status { font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 4px; }
  .info-status::before { content: "●"; font-size: 10px; color: #4caf50; }
  .header-btns button{ background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:14px; font-size:13px; margin-left:6px; }

  /* 聊天区 */
  #messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; scroll-behavior: smooth; }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 85%; animation: fade .3s ease; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.oracle { align-self: flex-start; }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
  
  .msg-content-wrapper { display: flex; flex-direction: column; }
  .msg-row.user .msg-content-wrapper { align-items: flex-end; }
  .msg-row.oracle .msg-content-wrapper { align-items: flex-start; }

  .msg-bubble { padding: 12px 16px; border-radius: 18px; line-height: 1.6; font-size: var(--font-size); word-break: break-word; position: relative; }
  .msg-row.user .msg-bubble { background: var(--user); border-top-right-radius: 4px; color: #fff; }
  .msg-row.oracle .msg-bubble { background: rgba(42, 36, 56, 0.9); border: 1px solid var(--border); border-top-left-radius: 4px; backdrop-filter: blur(5px); }

  /* 时间戳与已读状态 */
  .msg-meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px; display: flex; gap: 4px; align-items: center; }
  .msg-row.user .msg-meta { justify-content: flex-end; }
  .msg-read-status { color: var(--accent); }

  /* 图片及表情包 */
  .chat-img { max-width: 140px; max-height: 140px; border-radius: 8px; display: block; }
  
  .msg.typing{ color: var(--muted); font-size: 14px; font-style: italic;}

  /* 底部输入区 */
  .input-area { background: rgba(30,27,41,0.95); border-top:1px solid var(--border); z-index:10; backdrop-filter: blur(5px); display: flex; flex-direction: column; }
  
  .emoji-bar { display: none; padding: 10px; gap: 12px; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--bg); align-items: center; }
  .emoji-bar.show { display: flex; }
  .emoji-bar span { cursor: pointer; font-size: 24px; }
  .emoji-bar img { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; cursor: pointer; flex-shrink: 0; border:1px solid var(--border); }
  
  form{ display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); align-items: center;}
  .btn-tool { background: transparent; border: none; font-size: 22px; color: var(--muted); padding: 0 5px; cursor: pointer;}
  input[type="text"]{ flex:1; padding:12px 16px; border-radius:24px; border:1px solid var(--border); background:rgba(18,16,26,0.8); color:var(--text); font-size:16px; outline:none; }
  button.send{ padding:0 20px; border-radius:24px; border:none; background:var(--accent); color:#1a1625; font-size:16px; font-weight:600; height: 44px; }
  button.send:disabled{ opacity:.5 }

  /* 管理面板 */
  #adminPanel{ position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:100; display:none; flex-direction:column; }
  #adminPanel.show{ display:flex }
  .admin-header{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  .admin-header h2{ font-size:16px; margin:0; color:var(--accent) }
  .admin-header button{ background:none; border:none; color:var(--text); font-size:16px }
  .admin-content{ flex:1; overflow-y:auto; padding:16px; }
  .section-title { font-size:15px; color:var(--text); margin:24px 0 10px 0; border-bottom:1px solid var(--border); padding-bottom:6px; }
  .section-title:first-child { margin-top: 0; }
  
  .form-group{ margin-bottom:12px }
  .form-group label{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:4px }
  .form-group input[type="text"], .form-group textarea { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:#1f1a2e; color:#fff; font-size:15px; resize:vertical; font-family:inherit; }
  .form-group input[type="file"]{ font-size:14px; color:var(--muted); }
  .form-group input[type="range"]{ width:100%; margin-top:8px; }
  .admin-btn{ width:100%; padding:12px; border-radius:8px; border:none; background:var(--accent); color:#1a1625; font-size:16px; font-weight:600; margin-top:5px; }
  
  .list-item{ display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--panel); border-radius:8px; margin-bottom:8px; }
  .list-item-info{ flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px; }
  .btn-delete{ background:var(--danger); color:#fff; border:none; border-radius:6px; padding:6px 10px; font-size:12px; margin-left:10px; flex-shrink: 0; }
  
  .data-btn-group{ display:flex; gap:10px; margin-top:20px; margin-bottom: 40px; }
  .data-btn-group button, .data-btn-group label{ flex:1; text-align:center; padding:10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<div id="bgLayer"></div><div id="bgMask"></div>

<header>
  <div class="header-left">
    <div class="avatar" id="oracleAvatar">🔮</div>
    <div class="info-box">
      <div class="info-name" id="oracleName">梦占灵体</div>
      <div class="info-status" id="oracleStatus">等待你的呼唤...</div>
    </div>
  </div>
  <div class="header-btns">
    <button id="openAdmin">设置</button>
    <button id="clear">清空</button>
  </div>
</header>

<main id="messages"></main>

<div class="input-area">
  <div class="emoji-bar" id="emojiBar"></div>
  
  <form id="inputBar">
    <button type="button" class="btn-tool" id="imgBtn">🖼️</button>
    <input type="file" id="chatImgUpload" accept="image/*" style="display:none;">
    
    <input type="text" id="input" placeholder="写下你想问的事…" autocomplete="off" enterkeyhint="send">
    
    <button type="button" class="btn-tool" id="giftBtn" title="送礼物">🎁</button>
    <button type="button" class="btn-tool" id="emojiBtn">😀</button>
    <button class="send" type="submit">发送</button>
  </form>
</div>

<!-- 管理面板 -->
<div id="adminPanel">
  <div class="admin-header">
    <h2>系统设置</h2>
    <button id="closeAdmin">关闭</button>
  </div>
  <div class="admin-content">
    
    <div class="section-title">基础与行为概率设置</div>
    <div class="form-group"><label>对方称呼</label><input type="text" id="settingOracleName"></div>
    <button class="admin-btn" id="saveNamesBtn" style="margin-bottom: 16px;">保存称呼</button>
    
    <div class="form-group"><label>聊天字体大小 (<span id="sizeLabel">15</span>px)</label><input type="range" id="settingFontSize" min="12" max="24" step="1"></div>
    
    <div class="form-group">
      <label>状态变化频率 (<span id="statusRateLabel">30</span>%)</label>
      <input type="range" id="settingStatusRate" min="0" max="100" step="10">
    </div>
    <div class="form-group">
      <label>主动邀约概率 (<span id="inviteRateLabel">20</span>%)</label>
      <input type="range" id="settingInviteRate" min="0" max="100" step="10">
    </div>
    <div class="form-group">
      <label>主动送礼物概率 (<span id="giftRateLabel">15</span>%)</label>
      <input type="range" id="settingGiftRate" min="0" max="100" step="5">
    </div>
    <!-- 新增：已读不回概率 -->
    <div class="form-group">
      <label style="color:var(--danger); font-weight:bold;">已读不回概率 (<span id="ignoreRateLabel">20</span>%)</label>
      <input type="range" id="settingIgnoreRate" min="0" max="100" step="10">
    </div>

    <div class="form-group" style="margin-top:20px;"><label>更换背景图片</label><input type="file" id="bgUpload" accept="image/*"></div>
    <button class="admin-btn" id="resetBgBtn" style="background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-bottom: 16px;">恢复默认背景</button>
    
    <div class="section-title">聊天对象头像</div>
    <div class="form-group"><input type="file" id="avatarUpload" accept="image/*"></div>

    <div class="section-title">批量添加随机状态（每行一个）</div>
    <div class="form-group"><textarea id="newStatusBatch" rows="3" placeholder="正在冥想&#10;倾听风的声音&#10;正在忙"></textarea></div>
    <button class="admin-btn" id="saveStatusBtn">批量保存状态</button>
    <div id="statusList"></div>

    <div class="section-title">批量添加字卡（占卜用，每行一句）</div>
    <div class="form-group"><textarea id="newCardBatch" rows="4" placeholder="顺其自然&#10;水逆退散"></textarea></div>
    <button class="admin-btn" id="saveCardBtn">批量保存字卡</button>
    <div id="customList"></div>

    <div class="section-title">批量添加邀约（每行一个事）</div>
    <div class="form-group"><textarea id="newInviteBatch" rows="3" placeholder="去散步&#10;看月亮"></textarea></div>
    <button class="admin-btn" id="saveInviteBtn">批量保存邀约</button>
    <div id="inviteList"></div>

    <div class="section-title">批量添加礼物（每行一个）</div>
    <div class="form-group"><textarea id="newGiftBatch" rows="3" placeholder="一颗发光的星星&#10;一朵永不凋零的花"></textarea></div>
    <button class="admin-btn" id="saveGiftBtn">批量保存礼物</button>
    <div id="giftList"></div>

    <div class="section-title">自定义表情包（可多选）</div>
    <div class="form-group"><input type="file" id="emojiUpload" accept="image/*" multiple></div>
    <div id="emojiList" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 20px;"></div>

    <div class="data-btn-group">
      <button id="exportBtn">导出所有数据</button>
      <label>导入数据 <input type="file" id="importFile" accept=".json" style="display:none;"></label>
    </div>
  </div>
</div>

<script>
/* ===== 1. 数据定义 ===== */
const DEFAULT_CARDS = ["梦", "水", "火", "山", "风", "月"].map((t, i) => ({ id: "d" + i, text: t }));
const DEFAULT_STATUSES = ["正在冥想", "倾听风的声音", "沉睡中...", "刚刚苏醒", "正在忙碌", "发呆中"];
const DEFAULT_INVITES = ["看一会儿月亮", "听一场雨", "去夜空下散步"];
const DEFAULT_GIFTS = ["一颗星星", "一片枫叶", "一个拥抱", "一朵发光的花"];
const REACTIONS = ["让我看看…", "我感受到了一股波动…", "这个问题很有意思。", "嗯…让我为你起一卦。", "稍等，命运正在回应你。", "卦象浮现了。"];

const KEY_CHAT = "dream_oracle_chat_v6", KEY_CUSTOM = "dream_oracle_custom_v6", KEY_STATUS = "dream_oracle_status_v6", KEY_INVITE = "dream_oracle_invite_v6", KEY_GIFT = "dream_oracle_gift_v6", KEY_EMOJI = "dream_oracle_emoji_v6", KEY_AVATAR = "dream_oracle_avatar_v6", KEY_SETTINGS = "dream_oracle_settings_v6";

let messages = JSON.parse(localStorage.getItem(KEY_CHAT) || "[]");
let customCards = JSON.parse(localStorage.getItem(KEY_CUSTOM) || "[]");
let customStatuses = JSON.parse(localStorage.getItem(KEY_STATUS) || "[]");
let customInvites = JSON.parse(localStorage.getItem(KEY_INVITE) || "[]");
let customGifts = JSON.parse(localStorage.getItem(KEY_GIFT) || "[]");
let customEmojis = JSON.parse(localStorage.getItem(KEY_EMOJI) || "[]");
let currentAvatar = localStorage.getItem(KEY_AVATAR) || "🔮";

let settings = JSON.parse(localStorage.getItem(KEY_SETTINGS) || '{"oracleName":"梦占灵体","cardSize":15,"bgImage":"","statusChangeRate":30,"inviteRate":20,"giftRate":15,"ignoreRate":20}');
let bag = []; 

// 互动状态
let pendingInvite = null;

const $messages = document.getElementById("messages"), $form = document.getElementById("inputBar"), $input = document.getElementById("input");
const $statusText = document.getElementById("oracleStatus"), $avatarBox = document.getElementById("oracleAvatar"), $oracleNameDisplay = document.getElementById("oracleName");
const $emojiBar = document.getElementById("emojiBar");

/* ===== 2. 核心工具 ===== */
const getAllCards = () => [...DEFAULT_CARDS, ...customCards];
const getAllStatuses = () => [...DEFAULT_STATUSES, ...customStatuses];
const getAllInvites = () => [...DEFAULT_INVITES, ...customInvites];
const getAllGifts = () => [...DEFAULT_GIFTS, ...customGifts];
const save = (key, data) => localStorage.setItem(key, JSON.stringify(data));
const randomChoice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const delay = (ms) => new Promise(r => setTimeout(r, ms));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function drawCard(){
  const allCards = getAllCards();
  if (bag.length === 0) bag = shuffle(allCards.map(c => c.id));
  return allCards.find(c => c.id === bag.pop()) || allCards[0];
}

// 格式化时间戳
function formatTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

function applySettings() {
  $oracleNameDisplay.textContent = settings.oracleName;
  document.getElementById("settingOracleName").value = settings.oracleName;
  
  document.documentElement.style.setProperty('--font-size', settings.cardSize + 'px');
  document.getElementById("settingFontSize").value = settings.cardSize;
  document.getElementById("sizeLabel").textContent = settings.cardSize;
  
  document.getElementById("settingStatusRate").value = settings.statusChangeRate;
  document.getElementById("statusRateLabel").textContent = settings.statusChangeRate;
  
  document.getElementById("settingInviteRate").value = settings.inviteRate;
  document.getElementById("inviteRateLabel").textContent = settings.inviteRate;

  document.getElementById("settingGiftRate").value = settings.giftRate;
  document.getElementById("giftRateLabel").textContent = settings.giftRate;

  document.getElementById("settingIgnoreRate").value = settings.ignoreRate;
  document.getElementById("ignoreRateLabel").textContent = settings.ignoreRate;

  document.documentElement.style.setProperty('--bg-image', settings.bgImage ? `url(${settings.bgImage})` : 'none');
}

function renderAvatar() {
  $avatarBox.innerHTML = currentAvatar.startsWith("data:image") ? `<img src="${currentAvatar}">` : currentAvatar;
}

function rollStatus() {
  const list = getAllStatuses();
  $statusText.textContent = list[Math.floor(Math.random() * list.length)];
}

/* ===== 3. 渲染逻辑 ===== */
function renderMessage(m){
  const row = document.createElement("div");
  const avatarContent = currentAvatar.startsWith("data:image") ? `<img src="${currentAvatar}">` : currentAvatar;
  const timeStr = formatTime(m.t);
  
  if (m.role === "user") {
    row.className = "msg-row user";
    let content = m.text ? `<div>${m.text}</div>` : "";
    if (m.image) content += `<img src="${m.image}" class="chat-img">`;
    
    // 用户消息底部：时间戳 + 已读状态
    const readStatus = m.read ? `<span class="msg-read-status">已读</span>` : `<span>未读</span>`;
    
    row.innerHTML = `
      <div class="msg-content-wrapper">
        <div class="msg-bubble">${content}</div>
        <div class="msg-meta">${readStatus} · ${timeStr}</div>
      </div>
    `;
    return row;
  }

  row.className = "msg-row oracle";
  
  if (m.image) {
    row.innerHTML = `
      <div class="avatar">${avatarContent}</div>
      <div class="msg-content-wrapper">
        <div class="msg-bubble" style="padding:0; background:transparent; border:none;">
          <img src="${m.image}" class="chat-img">
        </div>
        <div class="msg-meta">${timeStr}</div>
      </div>
    `;
    return row;
  }

  row.innerHTML = `
    <div class="avatar">${avatarContent}</div>
    <div class="msg-content-wrapper">
      <div class="msg-bubble">${m.text}</div>
      <div class="msg-meta">${timeStr}</div>
    </div>
  `;
  return row;
}

function renderAll(){
  $messages.innerHTML = "";
  messages.forEach(m => $messages.appendChild(renderMessage(m)));
  scrollBottom();
}
function scrollBottom(){ requestAnimationFrame(() => { $messages.scrollTop = $messages.scrollHeight; }); }

// 重新渲染单条消息（用于更新已读状态）
function updateMessageStatus(idx) {
  const rows = $messages.children;
  if (rows[idx]) {
    const newRow = renderMessage(messages[idx]);
    $messages.replaceChild(newRow, rows[idx]);
  }
}

function createTypingBubble() {
  const row = document.createElement("div");
  row.className = "msg-row oracle";
  let avatarContent = currentAvatar.startsWith("data:image") ? `<img src="${currentAvatar}">` : currentAvatar;
  row.innerHTML = `<div class="avatar">${avatarContent}</div><div class="msg-content-wrapper"><div class="msg-bubble msg typing" id="typingText">…</div></div>`;
  return row;
}

/* ===== 4. 核心对话与互动逻辑 ===== */
let isProcessing = false;

async function handleSend(text, imageBase64 = null) {
  if (isProcessing || (!text && !imageBase64)) return;
  isProcessing = true;
  $input.value = "";
  
  // 1. 用户发消息
  const userMsg = { role:"user", text: text || "", image: imageBase64, t: Date.now(), read: false };
  messages.push(userMsg); 
  $messages.appendChild(renderMessage(userMsg)); 
  save(KEY_CHAT, messages); 
  scrollBottom();

  const userMsgIndex = messages.length - 1;

  // 模拟对方看手机的时间（1-2秒后变成已读）
  const readDelay = 1000 + Math.random() * 1000;
  setTimeout(() => {
    messages[userMsgIndex].read = true;
    save(KEY_CHAT, messages);
    // 如果当前没有被卡住，就更新状态
    updateMessageStatus(userMsgIndex);
  }, readDelay);

  await delay(readDelay);

  // ==========================================
  // 【判断：是否触发已读不回】
  // ==========================================
  if (Math.random() * 100 < settings.ignoreRate) {
    // 已读不回，直接结束对话流程
    if (Math.random() < 0.5) { // 50%概率顺手改个状态
      rollStatus();
    }
    isProcessing = false;
    $input.focus();
    return; 
  }

  // 如果没触发，正常开始准备回复
  if (Math.random() * 100 < settings.statusChangeRate) rollStatus();

  const typingRow = createTypingBubble();
  $messages.appendChild(typingRow); scrollBottom();
  const $typingText = typingRow.querySelector("#typingText");

  await delay(600 + Math.random() * 400);

  // ==========================================
  // 场景 A：检测用户是否在回应“邀约”或“送礼”
  // ==========================================
  let preText = "";
  if (pendingInvite && text) {
    const isYes = /好|行|愿意|去|可以|嗯|走/i.test(text);
    const isNo = /不|改天|算了|没空|拒/i.test(text);
    
    if (isYes) preText = `（开心地）太好了！那我们这就去${pendingInvite}吧。`;
    else if (isNo) preText = `（失落地低下头）好吧…那下次有机会再去${pendingInvite}吧。`;
    else preText = "其实你只要回答我好不好就行了…";
    
    pendingInvite = null;
  } 
  else if (text && text.includes("送你")) {
    preText = "哇！谢谢你的礼物，我很喜欢！";
  }
  else {
    preText = imageBase64 ? "你发来的这个，气场很特别… " : randomChoice(REACTIONS) + " ";
  }

  // 打字机输出
  for (let i = 0; i < preText.length; i++) {
    $typingText.textContent = preText.substring(0, i + 1);
    scrollBottom();
    await delay(40 + Math.random() * 40);
  }
  
  await delay(400);
  typingRow.remove();
  
  const preMsg = { role: "oracle", text: preText.trim(), t: Date.now() };
  messages.push(preMsg); $messages.appendChild(renderMessage(preMsg)); save(KEY_CHAT, messages); scrollBottom();

  await delay(400);
  const typingRow2 = createTypingBubble();
  typingRow2.querySelector("#typingText").textContent = "…";
  $messages.appendChild(typingRow2); scrollBottom();

  await delay(800 + Math.random() * 500);
  typingRow2.remove();

  // ==========================================
  // 场景 B：触发随机事件（邀约 > 送礼 > 抽卡）
  // ==========================================
  const rand = Math.random() * 100;
  
  if (rand < settings.inviteRate) {
    const inviteText = randomChoice(getAllInvites());
    pendingInvite = inviteText;
    const inviteMsg = { role: "oracle", text: `你愿意和我一起${inviteText}吗？`, t: Date.now() };
    messages.push(inviteMsg); $messages.appendChild(renderMessage(inviteMsg)); save(KEY_CHAT, messages); scrollBottom();
  } 
  else if (rand < settings.inviteRate + settings.giftRate) {
    const giftText = randomChoice(getAllGifts());
    const giftMsg = { role: "oracle", text: `突然想送你一个东西… 登登！是${giftText}，希望你喜欢。`, t: Date.now() };
    messages.push(giftMsg); $messages.appendChild(renderMessage(giftMsg)); save(KEY_CHAT, messages); scrollBottom();
  } 
  else {
    const card = drawCard();
    const oracleMsg = { role:"oracle", text: card.text || "……", t: Date.now() };
    messages.push(oracleMsg); $messages.appendChild(renderMessage(oracleMsg)); save(KEY_CHAT, messages); scrollBottom();
  }
  
  if (Math.random() < 0.3) {
    await delay(600);
    let emojiMsg = { role: "oracle", t: Date.now() };
    if (customEmojis.length > 0 && Math.random() < 0.7) {
      emojiMsg.image = customEmojis[Math.floor(Math.random() * customEmojis.length)];
    } else {
      emojiMsg.text = randomChoice(["🔮", "✨", "🌙", "🌿", "🫧"]);
    }
    messages.push(emojiMsg); $messages.appendChild(renderMessage(emojiMsg)); save(KEY_CHAT, messages); scrollBottom();
  }

  isProcessing = false;
  $input.focus();
}

$form.onsubmit = (e) => {
  e.preventDefault();
  const text = $input.value.trim();
  if (text) handleSend(text);
};

document.getElementById("giftBtn").onclick = () => {
  const gifts = getAllGifts();
  const randomGift = randomChoice(gifts);
  handleSend(`送给你：${randomGift} 🎁`);
};

document.getElementById("imgBtn").onclick = () => document.getElementById("chatImgUpload").click();
document.getElementById("chatImgUpload").onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { handleSend("", ev.target.result); e.target.value = ""; };
  reader.readAsDataURL(file);
};

function renderEmojis() {
  $emojiBar.innerHTML = `<span>🔮</span><span>🌙</span><span>✨</span><span>🌿</span><span>🕯️</span><span>🫧</span>`;
  $emojiBar.querySelectorAll("span").forEach(span => {
    span.onclick = () => { $input.value += span.textContent; $input.focus(); };
  });
  customEmojis.forEach((base64) => {
    const img = document.createElement("img");
    img.src = base64;
    img.onclick = () => { handleSend("", base64); $emojiBar.classList.remove("show"); };
    $emojiBar.appendChild(img);
  });
}
document.getElementById("emojiBtn").onclick = () => { renderEmojis(); $emojiBar.classList.toggle("show"); };

/* ===== 5. 管理面板 ===== */
document.getElementById("openAdmin").onclick = () => { renderCustomList(); renderStatusList(); renderInviteList(); renderGiftList(); renderEmojiList(); document.getElementById("adminPanel").classList.add("show"); };
document.getElementById("closeAdmin").onclick = () => document.getElementById("adminPanel").classList.remove("show");

document.getElementById("saveNamesBtn").onclick = () => { settings.oracleName = document.getElementById("settingOracleName").value.trim() || "梦占灵体"; save(KEY_SETTINGS, settings); applySettings(); alert("已保存"); };
document.getElementById("settingFontSize").oninput = (e) => { document.getElementById("sizeLabel").textContent = e.target.value; document.documentElement.style.setProperty('--font-size', e.target.value + 'px'); settings.cardSize = parseInt(e.target.value); save(KEY_SETTINGS, settings); };
document.getElementById("settingStatusRate").oninput = (e) => { document.getElementById("statusRateLabel").textContent = e.target.value; settings.statusChangeRate = parseInt(e.target.value); save(KEY_SETTINGS, settings); };
document.getElementById("settingInviteRate").oninput = (e) => { document.getElementById("inviteRateLabel").textContent = e.target.value; settings.inviteRate = parseInt(e.target.value); save(KEY_SETTINGS, settings); };
document.getElementById("settingGiftRate").oninput = (e) => { document.getElementById("giftRateLabel").textContent = e.target.value; settings.giftRate = parseInt(e.target.value); save(KEY_SETTINGS, settings); };
document.getElementById("settingIgnoreRate").oninput = (e) => { document.getElementById("ignoreRateLabel").textContent = e.target.value; settings.ignoreRate = parseInt(e.target.value); save(KEY_SETTINGS, settings); };

document.getElementById("bgUpload").onchange = (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { settings.bgImage = ev.target.result; save(KEY_SETTINGS, settings); applySettings(); }; r.readAsDataURL(f); };
document.getElementById("resetBgBtn").onclick = () => { settings.bgImage = ""; save(KEY_SETTINGS, settings); applySettings(); };
document.getElementById("avatarUpload").onchange = (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { currentAvatar = ev.target.result; localStorage.setItem(KEY_AVATAR, currentAvatar); renderAvatar(); renderAll(); }; r.readAsDataURL(f); };

function batchAdd(inputId, customArr, key, renderFn) {
  const text = document.getElementById(inputId).value.trim(); if (!text) return;
  const lines = text.split("\n").map(s => s.trim()).filter(s => s);
  lines.forEach(s => { if(!customArr.includes(s)) customArr.push(s); });
  save(key, customArr); document.getElementById(inputId).value = ""; renderFn(); alert(`成功添加 ${lines.length} 条！`);
}

function renderList(listId, arr, delFnName) {
  const $l = document.getElementById(listId); $l.innerHTML = "";
  arr.forEach((s, i) => { 
    const d = document.createElement("div"); d.className = "list-item"; 
    d.innerHTML = `<div class="list-item-info">${s.text || s}</div><button class="btn-delete" onclick="${delFnName}(${i})">删除</button>`; 
    $l.appendChild(d); 
  });
}

document.getElementById("saveStatusBtn").onclick = () => batchAdd("newStatusBatch", customStatuses, KEY_STATUS, renderStatusList);
function renderStatusList() { renderList("statusList", customStatuses, "delStatus"); }
window.delStatus = (i) => { if(confirm("删除？")) { customStatuses.splice(i,1); save(KEY_STATUS, customStatuses); renderStatusList(); } };

document.getElementById("saveCardBtn").onclick = () => {
  const text = document.getElementById("newCardBatch").value.trim(); if (!text) return;
  const lines = text.split("\n").map(s => s.trim()).filter(s => s);
  lines.forEach(s => { customCards.push({ id: "c_" + Date.now() + Math.random().toString(36).substr(2, 5), text: s }); });
  save(KEY_CUSTOM, customCards); document.getElementById("newCardBatch").value = ""; bag = []; renderCustomList(); alert(`成功添加 ${lines.length} 张字卡！`);
};
function renderCustomList() { renderList("customList", customCards, "delCard"); }
window.delCard = (id) => { if(confirm("删除？")) { customCards = customCards.filter(c => c.id !== id); save(KEY_CUSTOM, customCards); renderCustomList(); bag = []; } };

document.getElementById("saveInviteBtn").onclick = () => batchAdd("newInviteBatch", customInvites, KEY_INVITE, renderInviteList);
function renderInviteList() { renderList("inviteList", customInvites, "delInvite"); }
window.delInvite = (i) => { if(confirm("删除？")) { customInvites.splice(i,1); save(KEY_INVITE, customInvites); renderInviteList(); } };

document.getElementById("saveGiftBtn").onclick = () => batchAdd("newGiftBatch", customGifts, KEY_GIFT, renderGiftList);
function renderGiftList() { renderList("giftList", customGifts, "delGift"); }
window.delGift = (i) => { if(confirm("删除？")) { customGifts.splice(i,1); save(KEY_GIFT, customGifts); renderGiftList(); } };

document.getElementById("emojiUpload").onchange = (e) => {
  const files = e.target.files; if (!files.length) return;
  let count = 0;
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      customEmojis.push(ev.target.result); count++;
      if (count === files.length) { save(KEY_EMOJI, customEmojis); renderEmojiList(); renderEmojis(); e.target.value = ""; alert(`成功添加 ${count} 个表情包！`); }
    };
    reader.readAsDataURL(file);
  });
};
function renderEmojiList() {
  const $list = document.getElementById("emojiList"); $list.innerHTML = "";
  customEmojis.forEach((base64, index) => {
    const div = document.createElement("div"); div.style.position = "relative";
    div.innerHTML = `<img src="${base64}" style="width:50px; height:50px; object-fit:cover; border-radius:8px; border: 1px solid var(--border);"><button onclick="delEmoji(${index})" style="position:absolute; top:-5px; right:-5px; background:var(--danger); color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:12px; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer;">×</button>`;
    $list.appendChild(div);
  });
}
window.delEmoji = (i) => { if(confirm("删除此表情？")) { customEmojis.splice(i, 1); save(KEY_EMOJI, customEmojis); renderEmojiList(); renderEmojis(); } };

document.getElementById("exportBtn").onclick = () => {
  const data = { cards: customCards, statuses: customStatuses, invites: customInvites, gifts: customGifts, emojis: customEmojis, avatar: currentAvatar, settings };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:"application/json"})); a.download = "oracle_backup.json"; a.click();
};
document.getElementById("importFile").onchange = (e) => {
  const file = e.target.files[0]; if(!file) return; const r = new FileReader();
  r.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if(data.cards) { data.cards.forEach(c => !customCards.find(x => x.id === c.id) && customCards.push(c)); save(KEY_CUSTOM, customCards); }
      if(data.statuses) { data.statuses.forEach(s => !customStatuses.includes(s) && customStatuses.push(s)); save(KEY_STATUS, customStatuses); }
      if(data.invites) { data.invites.forEach(s => !customInvites.includes(s) && customInvites.push(s)); save(KEY_INVITE, customInvites); }
      if(data.gifts) { data.gifts.forEach(s => !customGifts.includes(s) && customGifts.push(s)); save(KEY_GIFT, customGifts); }
      if(data.emojis) { data.emojis.forEach(e => !customEmojis.includes(e) && customEmojis.push(e)); save(KEY_EMOJI, customEmojis); }
      if(data.avatar) { currentAvatar = data.avatar; localStorage.setItem(KEY_AVATAR, currentAvatar); renderAvatar(); }
      if(data.settings) { settings = { ...settings, ...data.settings }; save(KEY_SETTINGS, settings); applySettings(); }
      bag = []; renderAll(); renderEmojiList(); renderEmojis(); 
      alert("导入成功"); document.getElementById("adminPanel").classList.remove("show");
    } catch(e) { alert("文件格式错误"); }
  };
  r.readAsText(file);
};

document.getElementById("clear").onclick = () => { if(confirm("清空所有对话？")) { messages = []; save(KEY_CHAT, messages); renderAll(); } };

/* ===== 6. 启动 ===== */
applySettings(); renderAvatar(); renderEmojis();
if (messages.length === 0) {
  const intro = { role: "oracle", text: "静心。写下你想问的事，我为你起卦。", t: Date.now() };
  messages.push(intro); save(KEY_CHAT, messages);
}
renderAll();
</script>
